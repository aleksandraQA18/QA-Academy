[tool.ruff]
line-length = 88
src = ["backend", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
log_file = "reports/testapi.log"
log_file_level = "DEBUG"
log_format = "%(asctime)s %(levelname)s %(message)s"
log_date_format = "%Y-%m-%d %H:%M:%S"
addopts = "--strict-markers"
markers = [
    "smoke: testy bezpieczne do uruchomienia na stage",
]